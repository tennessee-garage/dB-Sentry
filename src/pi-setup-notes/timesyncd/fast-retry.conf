# Installed as /etc/systemd/timesyncd.conf.d/fast-retry.conf
# timesyncd's first attempt at boot happens before WiFi/DNS are up and fails; with the
# default 30s retry the clock didn't sync until ~41s after boot. Until then the Pi
# (which has no RTC) runs on the clock saved at last shutdown.
[Time]
ConnectionRetrySec=5
