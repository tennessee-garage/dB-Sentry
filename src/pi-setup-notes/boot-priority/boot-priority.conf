# Installed as a drop-in for grafana-server.service and telegraf.service:
#   /etc/systemd/system/<unit>.d/boot-priority.conf
# Only applies while the system is booting: these heavy services yield CPU and
# disk to influxdb, limit-service and the interface so the display menu is ready
# sooner. They return to normal priority once boot completes.
[Service]
StartupCPUWeight=20
StartupIOWeight=20
